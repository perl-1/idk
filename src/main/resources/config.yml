# ===== SaikoMC config =====
prefix: "&b&lSaikoMC &8» &r"
currency:
  symbol: "$"
starting-balance: 500

gambling:
  min-bet: 10
  max-bet: 100000
  cooldown-seconds: 3
  house-edge-percent: 5        # cut taken from coinflip/dice profit
  broadcast-wins-over: 10000   # announce big wins to the server
  slots:
    two-multiplier: 1.3        # 2 matching symbols
    three-multiplier: 10       # 3 matching symbols
    jackpot-multiplier: 25     # 3x Seven

daily:
  base: 100
  streak-bonus: 25             # extra per consecutive day
  max-streak-days: 14

market:
  tax-percent: 5
  max-listings-per-player: 5

bounty:
  min-amount: 100

lottery:
  ticket-price: 100
  max-tickets-per-player: 20
  draw-interval-minutes: 60
  tax-percent: 10

# Money for killing mobs (randomised +-20%)
mob-rewards:
  ZOMBIE: 5
  SKELETON: 5
  SPIDER: 4
  CREEPER: 8
  ENDERMAN: 15
  WITCH: 20
  BLAZE: 15
  WITHER_SKELETON: 30
  ELDER_GUARDIAN: 500
  WARDEN: 1500
  ENDER_DRAGON: 5000

# buy = price to buy 1, sell = price you get for 1. Use 0 to disable that direction.
shop:
  title: "&6&lServer Shop"
  categories:
    blocks:
      name: "&aBlocks"
      icon: GRASS_BLOCK
      items:
        STONE: {buy: 10, sell: 2}
        COBBLESTONE: {buy: 6, sell: 1}
        DIRT: {buy: 4, sell: 1}
        OAK_LOG: {buy: 12, sell: 3}
        SAND: {buy: 8, sell: 2}
        GLASS: {buy: 12, sell: 3}
        BRICKS: {buy: 40, sell: 8}
        OBSIDIAN: {buy: 150, sell: 30}
    food:
      name: "&6Food"
      icon: COOKED_BEEF
      items:
        BREAD: {buy: 15, sell: 3}
        COOKED_BEEF: {buy: 25, sell: 6}
        GOLDEN_CARROT: {buy: 60, sell: 12}
        GOLDEN_APPLE: {buy: 400, sell: 80}
        CAKE: {buy: 80, sell: 15}
    ores:
      name: "&bOres & Gems"
      icon: DIAMOND
      items:
        COAL: {buy: 15, sell: 4}
        IRON_INGOT: {buy: 40, sell: 10}
        GOLD_INGOT: {buy: 80, sell: 20}
        REDSTONE: {buy: 20, sell: 5}
        LAPIS_LAZULI: {buy: 25, sell: 6}
        DIAMOND: {buy: 300, sell: 75}
        EMERALD: {buy: 250, sell: 60}
        NETHERITE_INGOT: {buy: 3000, sell: 700}
    farming:
      name: "&2Farming"
      icon: WHEAT
      items:
        WHEAT: {buy: 8, sell: 2}
        CARROT: {buy: 6, sell: 1}
        POTATO: {buy: 6, sell: 1}
        PUMPKIN: {buy: 15, sell: 4}
        MELON_SLICE: {buy: 4, sell: 1}
        SUGAR_CANE: {buy: 8, sell: 2}
    loot:
      name: "&dMob Loot (sell only)"
      icon: ROTTEN_FLESH
      items:
        ROTTEN_FLESH: {buy: 0, sell: 1}
        BONE: {buy: 0, sell: 2}
        STRING: {buy: 0, sell: 2}
        GUNPOWDER: {buy: 0, sell: 5}
        ENDER_PEARL: {buy: 0, sell: 25}
        BLAZE_ROD: {buy: 0, sell: 20}

# ===== Scoreboard =====
# Placeholders: %player% %money% %money_full% %rank% %clan% %kills% %deaths% %kdr%
#               %playtime% %ip% %online% %max% %ping%   (any PlaceholderAPI placeholder also works)
scoreboard:
  enabled: true
  update-ticks: 20
  title: "&b&lSAIKOMC"
  server-ip: "play.saikomc.net"   # <- put your real server IP here
  lines:                          # max 15 lines
    - "&8&m                    "
    - "&b&l» &fMoney: &a%money%"
    - "&b&l» &fRank: &e%rank%"
    - "&b&l» &fClan: &d%clan%"
    - "&b&l» &fKills: &c%kills%"
    - "&b&l» &fPlaytime: &b%playtime%"
    - " "
    - "&7%ip%"

rank:
  mode: group        # group = LuckPerms primary group name | prefix = LuckPerms prefix
  fallback: "Member"

clan:
  # Clan comes from your existing clan plugin through PlaceholderAPI.
  # Put the placeholder your clan plugin provides here (check its docs / /papi list).
  placeholder: "%simpleclans_clan_name%"
  none-text: "None"
